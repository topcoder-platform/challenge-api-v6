packages:
  - .
  - packages/challenge-prisma-client

# Linked service packages retain Git dependencies; allow their existing dependency graph.
blockExoticSubdeps: false

allowBuilds:
  '@prisma/engines': true
  prisma: true
  '@scarf/scarf': false
  dtrace-provider: false

overrides:
  'baseline-browser-mapping': 2.11.0
  'browserslist': 4.28.8
  'proxy-addr': 2.0.8
  'axios': 1.20.0
  'follow-redirects': 1.16.2
  'multer': 2.5.0
  'qs': 6.16.1
  'joi': 18.3.1
  'moment': 2.31.0
  'mysql2': 3.23.1
  'hono': 4.13.11
  '@hono/node-server': 2.1.3
  'js-yaml@^3': 3.15.2
  'js-yaml@^4': 4.3.2
  'js-yaml@^5': 5.4.1
  'brace-expansion@^1': 1.1.21
  'brace-expansion@^2': 2.1.7
  'brace-expansion@^5': 5.0.12
  'fast-uri': 4.2.3
  'body-parser@^2': 2.4.0
  'glob@>=9': 14.0.2
  'minimatch@<9': file:tools/minimatch-compat
  'minimatch@>=9': 11.0.1
  '@babel/core@<=7.29.0': 7.29.6
  'ajv@<6.14.0': 6.15.0
  'deepmerge-ts@<8.0.0': 8.0.0
