packages:
  - .
  - packages/challenge-prisma-client

# topcoder-bus-api-wrapper intentionally resolves tc-core-library-js from Git.
# Preserve that established dependency graph when using pnpm 11's stricter defaults.
blockExoticSubdeps: false

allowBuilds:
  '@prisma/engines': true
  prisma: true
  '@scarf/scarf': false
  dtrace-provider: false

overrides:
  '@babel/core@<=7.29.0': 7.29.6
  '@hono/node-server@<2.0.11': 2.0.11
  'ajv@<6.14.0': 6.15.0
  'axios@<1.18.1': 1.18.1
  'brace-expansion@>=1.0.0 <2.0.0': 1.1.16
  'brace-expansion@>=2.0.0 <3.0.0': 2.1.2
  'diff@>=5.0.0 <6.0.0': 5.2.2
  'diff@>=6.0.0 <8.0.3': 8.0.4
  'fast-uri@>=3.0.0 <3.1.4': 3.1.4
  'fast-xml-parser@<5.7.0': 5.10.1
  'flatted@<3.4.2': 3.4.2
  'follow-redirects@<1.16.0': 1.16.0
  'form-data@<4.0.6': 4.0.6
  'js-yaml@>=3.0.0 <4.0.0': 3.15.0
  'js-yaml@>=4.0.0 <4.1.2': 4.3.0
  'minimatch@>=3.0.0 <3.1.4': 3.1.5
  'minimatch@>=9.0.0 <9.0.7': 9.0.9
  'path-to-regexp@>=8.0.0 <8.4.0': 8.4.2
  'picomatch@>=2.0.0 <2.3.2': 2.3.2
  'qs@<6.15.2': 6.15.3
  'serialize-javascript@<7.0.5': 7.0.7
  'uuid@<11.1.1': 11.1.1
